services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fightcalendar
      POSTGRES_USER: fightcalendar
      POSTGRES_PASSWORD: fightcalendar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fightcalendar -d fightcalendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fightcalendar;Username=fightcalendar;Password=fightcalendar"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy

  sync:
    build:
      context: .
      dockerfile: Dockerfile.Sync
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fightcalendar;Username=fightcalendar;Password=fightcalendar"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
